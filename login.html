<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body style="margin:0; font-family:Arial, 'Noto Sans KR', sans-serif; color:#111; background:#fff;">
    <div style="width:489px; margin:0 auto; background:#fff; overflow:hidden;">
        <header style="height:43px; background:#9b572b url('assets/wood-texture.jpg') center/cover; display:flex; align-items:center; justify-content:space-between; padding:0 25px; border-top:1px solid #b9794d;">
            <a href="index.html" style="font-size:18px; font-weight:700; color:#18345a; text-decoration:underline;">Baustelle</a>
            <nav style="display:flex; align-items:center; gap:16px;">
                <a href="index.html" style="font-size:9px; color:#000; text-decoration:underline;">Home</a>
                <a href="about.html" style="font-size:9px; color:#000; text-decoration:underline;">About</a>
                <a href="cart.html" style="font-size:9px; color:#000; text-decoration:underline;">shopping cart</a>
                <a href="login.html" style="background:#000; color:#fff; text-decoration:none; padding:8px 11px; border-radius:6px; font-size:10px;">Login</a>
            </nav>
        </header>
        <main style="padding:31px 51px 0; min-height:487px; position:relative;">
            <h1 style="font-size:25px; margin:0 0 35px;">회원가입</h1>
            <div style="margin-bottom:28px;">
                <label style="display:block; font-size:11px; font-weight:700; margin-bottom:6px;">ID *</label>
                <input placeholder="영문, 숫자 포함 6~20자" style="width:100%; height:38px; border:1px solid #c8c8c8; padding:0 9px; font-size:12px;">
            </div>
            <div style="margin-bottom:28px;">
                <label style="display:block; font-size:11px; font-weight:700; margin-bottom:6px;">Email *</label>
                <input placeholder="example@email.com" style="width:100%; height:38px; border:1px solid #c8c8c8; padding:0 9px; font-size:12px;">
            </div>
            <div style="margin-bottom:28px;">
                <label style="display:block; font-size:11px; font-weight:700; margin-bottom:6px;">Password *</label>
                <input placeholder="영문, 숫자, 특수문자 포함 8자 이상" type="password" style="width:100%; height:38px; border:1px solid #c8c8c8; padding:0 9px; font-size:12px;">
            </div>
            <button onclick="alert('다음 단계로 이동합니다.')" style="position:absolute; left:0; right:0; bottom:0; width:100%; height:36px; background:#aaa; border:0; font-size:12px;">다음</button>
        </main>
    </div>
</body>
</html>
